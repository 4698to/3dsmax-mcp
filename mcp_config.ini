[mcp]
safe_mode = true
# Transport selection (Max-side mcp_server.ms):
#   auto   = use the native bridge when present, else TCP fallback (default)
#   tcp    = always start the TCP server (even alongside a native bridge)
#   native = never start TCP, rely on the native bridge only
# You can also switch this live from the MCP Panel (macroScript MCP_Panel).
transport = auto
# External MCP tool exposure: full (default), progressive, or core.
# Progressive saves schema context and can help local or smaller models.
tool_profile = full
# TCP fallback is opt-in via the MCP Start macroscript / MCP Panel. Keep idle
# polling sparse to avoid viewport stutter when the native bridge is unavailable.
tcp_idle_poll_interval_ms = 1500
tcp_active_poll_interval_ms = 50
tcp_active_poll_ticks_after_request = 10
